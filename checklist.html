<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#37352f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Checklist do turno</title>
<link rel="stylesheet" href="ocorr.css">
<link rel="stylesheet" href="paginas.css">
<script src="rv-config.js"></script><script src="rv.js"></script><script src="acesso.js" data-exigir="conferente"></script>
</head>
<body>
<div class="wrap">
  <a class="back" href="conferente.html">← Menu</a>
  <div class="ico">✅</div>
  <h1>Checklist do turno</h1>
  <p class="sub">Marcações ficam salvas neste aparelho.</p>

  <div id="checks"></div>
  <div class="row"><button class="btn" id="reset">Limpar checklist</button></div>
</div>
<script src="util.js"></script>
<script>
const items=[
 "Conferir status dos veículos (03.11.10)",
 "Atualização diária feita (03.04.29.04)",
 "Mapas exportados e PCD conferido",
 "Pendências de mapa/placa verificadas (03.03.44.01)",
 "Carregamentos informados (03.11.01)",
 "Prestações de contas do retorno concluídas (03.03.02)",
 "Refugos lançados e conferidos",
 "Boletos e protocolos de vales conferidos",
 "Passagem de turno anotada"
];
const KEY="conferente_check_v1";
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return{}}}
function save(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
const st=load();
const box=document.getElementById("checks");
items.forEach((t,i)=>{
  const l=document.createElement("label");l.className="check";
  l.innerHTML=`<input type="checkbox" ${st[i]?"checked":""}><span>${t}</span>`;
  l.querySelector("input").addEventListener("change",ev=>{st[i]=ev.target.checked;save(st)});
  box.appendChild(l);
});
document.getElementById("reset").onclick=()=>{box.querySelectorAll("input").forEach(i=>i.checked=false);Object.keys(st).forEach(k=>delete st[k]);save(st)};


</script>
</body>
</html>
