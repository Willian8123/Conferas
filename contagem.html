<script>
"use strict";
/* ================= utilidades ================= */
const $ = (s, r) => (r || document).querySelector(s);
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = (t) => String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const fmt = (n) => (n == null || isNaN(n)) ? "—" : Number(n).toLocaleString("pt-BR", { maximumFractionDigits: 2 });
const p2 = (n) => String(n).padStart(2, "0");
function dataBR(iso) {
  const d = new Date(iso);
  return p2(d.getDate()) + "/" + p2(d.getMonth() + 1) + "/" + d.getFullYear() + " " + p2(d.getHours()) + ":" + p2(d.getMinutes());
}
function stamp(iso) {
  const d = new Date(iso);
  return d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + "-" + p2(d.getHours()) + p2(d.getMinutes());
}
let toastT;
function aviso(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.add("hidden"), 3200);
}
const plural = (n, s, p) => (n === 1 ? s : p);

/* ================= armazenamento ================= */
const K = { atual: "contagem_atual_v1", hist: "contagem_hist_v1", nome: "contagem_contador_v1" };
function ler(k, def) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? def : v; } catch (e) { return def; } }
function gravar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }

/* Tipos contados: cada um é uma soma digitada (ex.: 15+20+12). Não há conversão entre eles. */
const ORDEM = ["pallet", "lastro", "cx", "un"];
const ROT = { pallet: "Pallets", lastro: "Lastros", cx: "Caixas", un: "Unidades" };
const ROT1 = { pallet: ["pallet", "pallets"], lastro: ["lastro", "lastros"], cx: ["caixa", "caixas"], un: ["unidade", "unidades"] };
const qVazio = () => ({ pallet: "", lastro: "", cx: "", un: "" });
// Colunas do relatório: as 3 de sempre; "Unidades" só aparece se algum produto tiver unidades.
const colunasRel = (r) => ORDEM.filter((t) => t !== "un" || r.itens.some((i) => i.un));

// Dados salvos pela versão anterior (linhas com fator) viram os três campos novos.
function migrarItem(it) {
  if (it.q && typeof it.q === "object") { if (it.q.un == null) it.q.un = ""; return it; }
  const q = { pallet: [], lastro: [], cx: [] };
  (it.linhas || []).forEach((l) => {
    const v = String(l && l.q || "").trim();
    if (l && q[l.tipo] && v) q[l.tipo].push(v);
  });
  it.q = { pallet: q.pallet.join("+"), lastro: q.lastro.join("+"), cx: q.cx.join("+"), un: "" };
  delete it.linhas;
  return it;
}
function migrarHist(h) {
  if (!h || !Array.isArray(h.itens)) return null;
  h.itens = h.itens.map((it) => {
    if (it && it.linhas) {
      return { cod: it.cod, nome: it.nome, pallet: null, lastro: null, cx: { t: it.total, e: (it.linhas || []).map((l) => l.det).join(" + ") } };
    }
    return it;
  });
  return h;
}
let atual = ler(K.atual, null);
if (atual && !Array.isArray(atual.itens)) atual = null;
if (atual) atual.itens.forEach(migrarItem);
let hist = ler(K.hist, []).map(migrarHist).filter(Boolean);
// Quem está contando vem do login (automático). Primeiro nome + sobrenome como cadastrado.
const nomeLogin = () => { try { return ((RV.perfilCache() || {}).nome || "").trim(); } catch (e) { return ""; } };
const salvarAtual = () => gravar(K.atual, atual);

/* ================= produtos ================= */
let P = [], PN = [], NOME = new Map();
function indexarProdutos() { P = Catalogo.lista(); PN = P.map((p) => norm(p[1])); NOME = new Map(P.map((p) => [p[0], p[1]])); }
indexarProdutos();
// Quando a lista compartilhada chega (ou muda), a busca e os nomes já escolhidos acompanham.
function atualizarNomes() {
  if (!atual) return;
  let mudou = false;
  atual.itens.forEach((it, i) => {
    const n = !it.custom && NOME.get(it.cod);
    if (n && n !== it.nome) {
      it.nome = n; mudou = true;
      const el = document.querySelector('.pc[data-i="' + i + '"] .ph .t b');
      if (el) el.textContent = n;
    }
  });
  if (mudou) salvarAtual();
}
Catalogo.aoMudar(() => { indexarProdutos(); atualizarNomes(); if (typeof rota === "function" && rota() === "/buscar") atualizarBusca(); });
Catalogo.carregar();

function buscarProdutos(q) {
  const t = norm(q).trim().split(/\s+/).filter(Boolean);
  if (!t.length) return null;
  const res = [];
  P.forEach((p, i) => {
    if (t.every((x) => PN[i].includes(x) || p[0].startsWith(x) || (/^\d{3,}$/.test(x) && p[0].includes(x)))) res.push(i);
  });
  const t0 = t[0];
  const rank = (i) => (P[i][0] === t0 ? 0 : P[i][0].startsWith(t0) ? 1 : 2);
  res.sort((a, b) => rank(a) - rank(b) || a - b);
  return res;
}

/* ================= cálculo ================= */
// Calculadora segura: aceita números e + - * x / ( ), com vírgula ou ponto decimal.
// Vazio -> null; expressão inválida -> NaN.
function calc(txt) {
  const s = String(txt == null ? "" : txt).toLowerCase().replace(/\s+/g, "").replace(/,/g, ".").replace(/[x×]/g, "*");
  if (!s) return null;
  if (!/^[0-9+\-*/().]+$/.test(s)) return NaN;
  let i = 0;
  function expr() { let v = term(); while (s[i] === "+" || s[i] === "-") { const o = s[i++]; const r = term(); v = o === "+" ? v + r : v - r; } return v; }
  function term() { let v = fac(); while (s[i] === "*" || s[i] === "/") { const o = s[i++]; const r = fac(); v = o === "*" ? v * r : v / r; } return v; }
  function fac() {
    if (s[i] === "-") { i++; return -fac(); }
    if (s[i] === "+") { i++; return fac(); }
    if (s[i] === "(") { i++; const v = expr(); if (s[i] !== ")") throw 0; i++; return v; }
    const m = /^\d+(\.\d+)?|^\.\d+/.exec(s.slice(i));
    if (!m) throw 0;
    i += m[0].length;
    return parseFloat(m[0]);
  }
  try {
    const v = expr();
    if (i !== s.length || !isFinite(v)) return NaN;
    return Math.round(v * 100) / 100;
  } catch (e) { return NaN; }
}
// "15+20+12" -> "15 + 20 + 12"; número simples não tem detalhe.
function exprExib(txt) {
  const s = String(txt || "").replace(/\s+/g, "");
  if (!s || /^[\d.,]+$/.test(s)) return "";
  return s.replace(/([+*/x×-])/g, " $1 ").replace(/\s+/g, " ").trim();
}
const valorTipo = (it, t) => calc(it.q[t]);
const temDigitado = (it) => ORDEM.some((t) => String(it.q[t] || "").trim());
const temValido = (it) => ORDEM.some((t) => { const v = valorTipo(it, t); return v != null && !isNaN(v); });
const temInvalido = (it) => ORDEM.some((t) => isNaN(valorTipo(it, t)));
let seq = 0;
const novoId = () => Date.now().toString(36) + (seq++).toString(36) + Math.random().toString(36).slice(2, 5);
const codExib = (it) => (it.custom ? (it.codUser || "") : it.cod);

/* ================= relatório (texto e PDF) ================= */
function celula(it, t) {
  const v = valorTipo(it, t);
  if (v == null || isNaN(v)) return null;
  return { t: v, e: exprExib(it.q[t]) };
}
// Foto fixa do que será enviado: só produtos com ao menos um tipo válido.
function montarRelatorio(c) {
  const itens = [];
  c.itens.forEach((it) => {
    if (!temValido(it)) return;
    itens.push({ cod: codExib(it), nome: it.nome, pallet: celula(it, "pallet"), lastro: celula(it, "lastro"), cx: celula(it, "cx"), un: celula(it, "un") });
  });
  return { id: c.id, inicio: c.inicio, fim: c.fim || new Date().toISOString(), contador: c.contador || nomeLogin(), setor: c.setor || "", itens };
}
function totaisRelatorio(r) {
  const tot = { pallet: 0, lastro: 0, cx: 0, un: 0 };
  r.itens.forEach((i) => ORDEM.forEach((t) => { if (i[t]) tot[t] += i[t].t; }));
  ORDEM.forEach((t) => { tot[t] = Math.round(tot[t] * 100) / 100; });
  return tot;
}
function resumoLinha(i) {
  return ORDEM.filter((t) => i[t]).map((t) => fmt(i[t].t) + " " + ROT1[t][i[t].t === 1 ? 0 : 1]).join(" · ");
}
function textoRelatorio(r) {
  let t = "*RECONTAGEM*\n" + dataBR(r.fim);
  if (r.contador) t += " | Contado por: " + r.contador;
  if (r.setor) t += " | Setor: " + r.setor;
  t += "\n\n";
  r.itens.forEach((i) => {
    t += (i.cod ? i.cod + " - " : "") + i.nome + "\n   " + ORDEM.filter((x) => i[x]).map((x) => {
      return ROT[x] + ": " + fmt(i[x].t);
    }).join(" | ") + "\n";
  });
  const tot = totaisRelatorio(r);
  t += "\n*Totais:* " + colunasRel(r).map((x) => ROT[x] + " " + fmt(tot[x])).join(" | ");
  t += "\n" + r.itens.length + " " + plural(r.itens.length, "produto contado", "produtos contados");
  return t;
}
async function gerarPdf(r) {
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const doc = await PDFDocument.create();
  const f = await doc.embedFont(StandardFonts.Helvetica);
  const fb = await doc.embedFont(StandardFonts.HelveticaBold);
  const suportado = new Set(f.getCharacterSet());
  const limpo = (s) => Array.from(String(s)).map((ch) => (suportado.has(ch.codePointAt(0)) ? ch : "?")).join("");
  const W = 595.28, H = 841.89, M = 40, FS = 9.5, LEAD = 12.5, PAD = 6;
  const cod = { x: M, w: 46 }, nome = { x: 90, w: 160 };
  const usadas = colunasRel(r), lc = 300 / usadas.length, cols = {};
  usadas.forEach((t, k) => { cols[t] = { x: 255 + k * lc, w: lc }; });
  const cinza = rgb(0.45, 0.45, 0.45), linha = rgb(0.85, 0.85, 0.85), zebra = rgb(0.965, 0.965, 0.955);
  function quebra(txt, fonte, tam, larg) {
    const palavras = limpo(txt).split(/\s+/).filter(Boolean);
    const out = []; let cur = "";
    palavras.forEach((w) => {
      const tentativa = cur ? cur + " " + w : w;
      if (fonte.widthOfTextAtSize(tentativa, tam) <= larg) { cur = tentativa; return; }
      if (cur) out.push(cur);
      while (fonte.widthOfTextAtSize(w, tam) > larg) {
        let k = w.length;
        while (k > 1 && fonte.widthOfTextAtSize(w.slice(0, k), tam) > larg) k--;
        out.push(w.slice(0, k)); w = w.slice(k);
      }
      cur = w;
    });
    if (cur) out.push(cur);
    return out.length ? out : [""];
  }
  const centro = (page, txt, fonte, tam, c, yy, cor) => {
    const w = fonte.widthOfTextAtSize(txt, tam);
    page.drawText(txt, { x: c.x + (c.w - w) / 2, y: yy, size: tam, font: fonte, color: cor });
  };
  let page, y;
  function cabecalhoTabela() {
    page.drawRectangle({ x: M, y: y - 18, width: W - 2 * M, height: 20, color: rgb(0.9, 0.9, 0.88) });
    const ty = y - 12;
    page.drawText("Cód.", { x: cod.x + 4, y: ty, size: 9, font: fb });
    page.drawText("Produto", { x: nome.x, y: ty, size: 9, font: fb });
    usadas.forEach((t) => centro(page, ROT[t], fb, 9, cols[t], ty));
    y -= 22;
  }
  function novaPagina() { page = doc.addPage([W, H]); y = H - M; }
  novaPagina();
  const LOGO_H = 36;
  try {
    const resp = await fetch("logo-ambev.png");
    if (resp.ok) {
      const img = await doc.embedPng(await resp.arrayBuffer());
      page.drawImage(img, { x: M, y: y - LOGO_H, width: LOGO_H * img.width / img.height, height: LOGO_H });
    }
  } catch (e) { /* sem logo: segue só com o título */ }
  const tit = "Recontagem", tw = fb.widthOfTextAtSize(tit, 22);
  page.drawText(tit, { x: (W - tw) / 2, y: y - LOGO_H / 2 - 8, size: 22, font: fb });
  y -= LOGO_H + 16;
  const info = [["Data", dataBR(r.fim)]];
  if (r.contador) info.push(["Contado por", r.contador]);
  if (r.setor) info.push(["Setor", r.setor]);
  info.push(["Produtos contados", String(r.itens.length)]);
  info.forEach(([k, v]) => {
    const kk = limpo(k + ": ");
    page.drawText(kk, { x: M, y: y - 10, size: 10, font: fb });
    page.drawText(limpo(v), { x: M + fb.widthOfTextAtSize(kk, 10), y: y - 10, size: 10, font: f });
    y -= 15;
  });
  y -= 10;
  cabecalhoTabela();
  r.itens.forEach((it, idx) => {
    const ln = quebra(it.nome, f, FS, nome.w);
    const ex = {};
    let altCel = 0;
    usadas.forEach((t) => {
      ex[t] = [];
      altCel = Math.max(altCel, it[t] ? 14 : 0);
    });
    const altura = Math.max(ln.length * LEAD, altCel) + 2 * PAD;
    if (y - altura < 80) { novaPagina(); cabecalhoTabela(); }
    if (idx % 2 === 1) page.drawRectangle({ x: M, y: y - altura, width: W - 2 * M, height: altura, color: zebra });
    const ty = y - PAD - FS;
    if (it.cod) page.drawText(limpo(it.cod), { x: cod.x + 4, y: ty, size: FS, font: f });
    ln.forEach((t, k) => page.drawText(t, { x: nome.x, y: ty - k * LEAD, size: FS, font: f }));
    usadas.forEach((t) => {
      const c = it[t];
      if (!c) { centro(page, "-", f, 11, cols[t], ty, cinza); return; }
      centro(page, limpo(fmt(c.t)), fb, 12, cols[t], ty - 1);
      ex[t].forEach((e, k) => centro(page, e, f, 7.5, cols[t], ty - 12 - k * 10, cinza));
    });
    page.drawLine({ start: { x: M, y: y - altura }, end: { x: W - M, y: y - altura }, thickness: 0.5, color: linha });
    y -= altura;
  });
  const pags = doc.getPages();
  pags.forEach((pg, i) => {
    const t = limpo("Recontagem - página " + (i + 1) + " de " + pags.length);
    pg.drawText(t, { x: W / 2 - f.widthOfTextAtSize(t, 8) / 2, y: 26, size: 8, font: f, color: cinza });
  });
  return await doc.save();
}
function baixar(blob, nomeArq) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nomeArq;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
// Abre o menu de compartilhar do celular com o PDF (escolhe-se o grupo ali). Sem suporte, baixa o arquivo.
async function enviarPdf(r, soBaixar) {
  const bytes = await gerarPdf(r);
  const blob = new Blob([bytes], { type: "application/pdf" });
  const nomeArq = "recontagem-" + stamp(r.fim) + ".pdf";
  if (!soBaixar && navigator.canShare && navigator.share) {
    const file = new File([blob], nomeArq, { type: "application/pdf" });
    if (navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: "Recontagem" });
        return "compartilhado";
      } catch (e) {
        if (e && e.name === "AbortError") return "cancelado";
      }
    }
  }
  baixar(blob, nomeArq);
  return "baixado";
}

/* ================= roteamento ================= */
const view = $("#view");
const rota = () => ((location.hash || "#/").slice(1).split("?")[0] || "/");
let barraAcao = null;
function barra(info, rotulo, acao, desativado) {
  $("#fixa").classList.remove("hidden");
  $("#fInfo").innerHTML = info;
  const b = $("#fBtn");
  b.textContent = rotulo;
  b.disabled = !!desativado;
  barraAcao = acao;
}
$("#fBtn").addEventListener("click", () => { if (barraAcao) barraAcao(); });
function render() {
  const r = rota();
  if (["/buscar", "/contar", "/enviar"].includes(r) && !atual) { location.replace("#/"); return; }
  $("#fixa").classList.add("hidden");
  barraAcao = null;
  const back = $("#back");
  if (r === "/buscar") { back.textContent = "← Recontagem"; back.href = atual.itens.length ? "#/contar" : "#/"; vBuscar(); }
  else if (r === "/contar") { back.textContent = "← Escolher produtos"; back.href = "#/buscar"; vContar(); }
  else if (r === "/enviar") { back.textContent = "← Quantidades"; back.href = "#/contar"; vEnviar(); }
  else { back.textContent = "← Menu"; back.href = "conferente.html"; vInicio(); }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);
function ir(p) { location.hash = "#" + p; }

/* ================= tela: início ================= */
function vInicio() {
  let h = '<div class="ico">🧮</div><h1>Recontagem</h1><p class="sub">Marque os produtos, lance pallets, lastros e caixas e envie o PDF para o grupo.</p>';
  if (atual && atual.itens.length) {
    h += `<div class="callout blue"><p><b>Recontagem em andamento</b><br>${atual.itens.length} ${plural(atual.itens.length, "produto", "produtos")} · iniciada em ${dataBR(atual.inicio)}</p></div>
      <div class="row"><button class="btn primary" data-a="continuar">Continuar recontagem</button><button class="btn danger" data-a="descartar">Descartar</button></div>`;
  } else {
    h += '<div class="row"><button class="btn primary big" data-a="nova">➕ Nova recontagem</button></div>';
  }
  h += '<div class="sec">Recontagens anteriores</div>';
  if (!hist.length) h += '<div class="list"><div class="empty">Nenhuma recontagem concluída ainda.</div></div>';
  else {
    h += '<div class="list hist">' + hist.map((c) => `
      <div class="li"><div class="t"><b>${dataBR(c.fim)}</b><span>${c.itens.length} ${plural(c.itens.length, "produto", "produtos")}${c.contador ? " · " + esc(c.contador) : ""}${c.setor ? " · " + esc(c.setor) : ""}</span></div>
      <button class="btn" data-a="hpdf" data-h="${esc(c.id)}">📄 PDF</button><button class="btn danger" data-a="hdel" data-h="${esc(c.id)}">Excluir</button></div>`).join("") + "</div>";
  }
  h += `<div class="sec">Dados do app</div>
    <div class="callout"><p>O histórico fica só neste aparelho: reinstalar o app ou limpar os dados do navegador apaga tudo. Faça um backup de vez em quando.</p></div>
    <div class="row"><button class="btn" data-a="exp">⬇️ Exportar backup</button><button class="btn" data-a="impBtn">⬆️ Importar backup</button><input type="file" id="imp" accept=".json,application/json" class="hidden"></div>`;
  view.innerHTML = h;
}

/* ================= tela: escolher produtos ================= */
let bq = "", bmodo = "todos", bshow = 60;
function vBuscar() {
  view.innerHTML = `<div class="ico">🔎</div><h1>Escolher produtos</h1>
    <p class="sub">Pesquise e marque os produtos. Pode pesquisar quantos quiser: as marcações ficam guardadas.</p>
    <div class="pbox"><input id="bq" class="search" type="search" inputmode="search" autocomplete="off" placeholder="Ex.: 2538  ·  pilsen 600  ·  guarana 2l" style="width:100%" value="${esc(bq)}"></div>
    <div class="chips"><button class="chip" data-m="todos" type="button">Pesquisar</button><button class="chip" data-m="marcados" type="button"></button></div>
    <div class="pmeta" id="bmeta"></div><div id="blista"></div>
    <button class="btn pmore hidden" id="bmais" type="button">Mostrar mais</button>
    <details class="novo"><summary>+ Produto que não está na lista</summary>
      <div class="grid"><div class="field"><label for="nn">Nome do produto</label><input id="nn" type="text" autocomplete="off"></div>
      <div class="field"><label for="nc">Código (opcional)</label><input id="nc" type="text" autocomplete="off" inputmode="numeric"></div></div>
      <div class="row"><button class="btn" id="nadd" type="button">Adicionar à recontagem</button></div></details>`;
  atualizarBusca();
}
function atualizarChips() {
  document.querySelectorAll(".chip").forEach((c) => {
    c.classList.toggle("on", c.dataset.m === bmodo);
    if (c.dataset.m === "marcados") c.textContent = "Marcados (" + atual.itens.length + ")";
  });
  const n = atual.itens.length;
  barra("<b>" + n + "</b> " + plural(n, "marcado", "marcados"), "Avançar →", () => ir("/contar"), n === 0);
}
function atualizarBusca() {
  atualizarChips();
  const marc = new Set(atual.itens.map((i) => i.cod));
  let rows = [];
  let meta = "";
  if (bmodo === "marcados") {
    rows = atual.itens.map((i) => [i.cod, i.nome, i.custom]);
    meta = rows.length ? "" : "Nenhum produto marcado ainda.";
  } else {
    const res = buscarProdutos(bq);
    if (!P.length) meta = "⚠️ A lista de produtos não carregou. Confira se o arquivo produtos-dados.js está no GitHub (na mesma pasta do index.html) e atualize o app.";
    else if (res === null) meta = P.length + " produtos na lista. Digite o código ou parte do nome.";
    else { rows = res.map((i) => [P[i][0], P[i][1]]); meta = res.length ? res.length + " encontrado(s)" : "Nenhum produto encontrado. Tente menos palavras."; }
  }
  $("#bmeta").textContent = meta;
  $("#blista").innerHTML = rows.slice(0, bshow).map((r) => {
    const on = marc.has(r[0]);
    return `<div class="sel ${on ? "on" : ""}" data-cod="${esc(r[0])}"><input type="checkbox" ${on ? "checked" : ""} tabindex="-1" aria-hidden="true"><span class="code">${esc(r[2] ? (atual.itens.find((i) => i.cod === r[0]).codUser || "—") : r[0])}</span><span class="nm">${esc(r[1])}</span></div>`;
  }).join("");
  const mais = $("#bmais");
  mais.classList.toggle("hidden", rows.length <= bshow);
  mais.textContent = "Mostrar mais (" + (rows.length - bshow) + " restantes)";
}
function alternar(cod) {
  const idx = atual.itens.findIndex((i) => i.cod === cod);
  if (idx >= 0) {
    const it = atual.itens[idx];
    if (temDigitado(it) && !confirm("Remover " + it.nome + " e as quantidades já lançadas?")) return false;
    atual.itens.splice(idx, 1);
  } else atual.itens.push({ cod, nome: NOME.get(cod) || cod, q: qVazio() });
  salvarAtual();
  return true;
}

/* ================= tela: quantidades ================= */
const EXEMPLO = { pallet: "Ex.: 15+20+12", lastro: "Ex.: 15+20+12", cx: "Ex.: 15+20+12", un: "Ex.: 24" };
function campoHtml(it, t) {
  const v = valorTipo(it, t);
  const ruim = !!String(it.q[t] || "").trim() && isNaN(v);
  return `<div class="tq"><label>${ROT[t]}</label><div class="r">
    <input class="qi ${ruim ? "bad" : ""}" data-t="${t}" inputmode="tel" autocomplete="off" placeholder="${EXEMPLO[t]}" aria-label="${ROT[t]}" value="${esc(it.q[t] || "")}">
    <button class="plus" type="button" data-t="${t}" aria-label="Somar mais um valor">＋</button>
    <span class="eq">= <b>${ruim ? "—" : fmt(v)}</b></span></div></div>`;
}
function resumoItem(it) {
  const partes = ORDEM.filter((t) => { const v = valorTipo(it, t); return v != null && !isNaN(v); })
    .map((t) => ROT[t] + " <b>" + fmt(valorTipo(it, t)) + "</b>");
  return partes.length ? partes.join(" · ") : "Sem quantidade ainda";
}
// Cartões recolhíveis: o nome e o resumo ficam sempre à vista; os campos aparecem ao tocar.
const abertos = new Set();
function statusItem(it) {
  if (temInvalido(it)) return ["bad", "!"];
  if (temValido(it)) return ["ok", "✓"];
  return ["vz", "○"];
}
function cartaoHtml(it, i) {
  const aberto = abertos.has(it.cod), [sc, si] = statusItem(it);
  return `<div class="pc ${aberto ? "open" : ""}" data-i="${i}">
    <button class="ph" type="button" data-a="toggle" aria-expanded="${aberto}">
      <span class="st ${sc}" aria-hidden="true">${si}</span>
      <span class="t"><b>${esc(it.nome)}</b>${codExib(it) ? `<span class="code">${esc(codExib(it))}</span>` : ""}<span class="resu">${resumoItem(it)}</span></span>
      <span class="chev" aria-hidden="true">▾</span>
    </button>
    <div class="pb">${ORDEM.map((t) => campoHtml(it, t)).join("")}
      <div class="rem"><button class="btn" type="button" data-a="xitem">Remover produto</button></div></div></div>`;
}
// Abre um cartão e fecha os outros (economiza tela). Tocar no aberto fecha.
function alternarCartao(card, focar) {
  const abrir = !card.classList.contains("open");
  document.querySelectorAll(".pc.open").forEach((c) => { c.classList.remove("open"); c.querySelector(".ph").setAttribute("aria-expanded", "false"); });
  abertos.clear();
  if (!abrir) return;
  card.classList.add("open");
  card.querySelector(".ph").setAttribute("aria-expanded", "true");
  abertos.add(atual.itens[+card.dataset.i].cod);
  requestAnimationFrame(() => {
    card.scrollIntoView({ block: "start", behavior: "smooth" });
    if (focar) { const q = card.querySelector(".qi"); if (q) q.focus({ preventScroll: true }); }
  });
}
function vContar() {
  const n = atual.itens.length;
  if (n === 1) abertos.add(atual.itens[0].cod); // só um produto: já vem aberto
  let h = `<div class="ico">🧮</div><h1>Quantidades</h1>
    <p class="sub">Toque no produto para abrir e digitar <b>pallets</b>, <b>lastros</b>, <b>caixas</b> soltas e <b>unidades</b>. Para somar vários valores, use o <b>+</b>: <b>15+20+12</b>.</p>
    <div class="row"><a class="btn" href="#/buscar">➕ Adicionar produto</a></div>`;
  h += n ? atual.itens.map(cartaoHtml).join("") : '<div class="empty">Nenhum produto marcado. Toque em “Adicionar produto”.</div>';
  view.innerHTML = h;
  atualizarBarraContar();
}
function atualizarBarraContar() {
  const n = atual.itens.length;
  const cont = atual.itens.filter(temValido).length;
  barra("<b>" + cont + "</b> de " + n + " com quantidade", "Revisar e enviar →", () => ir("/enviar"), n === 0);
}
function atualizarCartao(card) {
  const it = atual.itens[+card.dataset.i];
  ORDEM.forEach((t) => {
    const inp = card.querySelector('.qi[data-t="' + t + '"]');
    const v = valorTipo(it, t);
    const ruim = !!String(it.q[t] || "").trim() && isNaN(v);
    inp.classList.toggle("bad", ruim);
    inp.closest(".r").querySelector(".eq b").textContent = ruim ? "—" : fmt(v);
  });
  card.querySelector(".resu").innerHTML = resumoItem(it);
  const [sc, si] = statusItem(it), st = card.querySelector(".st");
  st.className = "st " + sc; st.textContent = si;
  atualizarBarraContar();
}

/* ================= tela: revisar e enviar ================= */
function relatorioAtual() {
  return montarRelatorio({ id: atual.id, inicio: atual.inicio, itens: atual.itens, contador: nomeLogin() || atual.contador, setor: atual.setor });
}
function vEnviar() {
  const r = relatorioAtual();
  const sem = atual.itens.filter((i) => !temValido(i) && !temInvalido(i));
  const inc = atual.itens.filter(temInvalido);
  let h = `<div class="ico">📤</div><h1>Revisar e enviar</h1><p class="sub">Confira os totais. O PDF mostra os totais de cada produto (pallets, lastros, caixas e, se usar, unidades).</p>
    <div class="grid"><div class="field"><label for="ct">Contado por (automático, do seu login)</label><input id="ct" type="text" value="${esc(nomeLogin())}" readonly disabled></div>
    <div class="field"><label for="st">Setor / local (opcional)</label><input id="st" type="text" autocomplete="off" value="${esc(atual.setor || "")}" placeholder="Ex.: Armazém, Rua A"></div></div>`;
  if (inc.length) h += `<div class="callout red"><p>⚠️ Há valores que não consegui somar em: <b>${inc.map((i) => esc(i.nome)).join("; ")}</b>. Esses campos não entram na soma. Volte e corrija (use só números e + - * /).</p></div>`;
  if (sem.length) h += `<div class="callout yellow"><p>${sem.length} ${plural(sem.length, "produto sem quantidade não entra", "produtos sem quantidade não entram")} no relatório: <b>${sem.map((i) => esc(i.nome)).join("; ")}</b>. Se o estoque for zero, digite <b>0</b>.</p></div>`;
  h += '<div class="sec">Resumo <small>' + r.itens.length + " " + plural(r.itens.length, "produto", "produtos") + "</small></div>";
  if (r.itens.length) {
    const tot = totaisRelatorio(r);
    h += '<div class="list resumo">' + r.itens.map((i) => {
      const det = "";
      return `<div class="it"><div class="l1"><b>${esc(i.nome)}</b></div><div class="l1b">${ORDEM.filter((t) => i[t]).map((t) => `<span>${ROT[t]} <b>${fmt(i[t].t)}</b></span>`).join("")}</div>${det || i.cod ? `<div class="l2">${i.cod ? esc(i.cod) + (det ? " · " : "") : ""}${esc(det)}</div>` : ""}</div>`;
    }).join("") + `<div class="it tt2"><div class="l1"><b>TOTAIS</b></div><div class="l1b">${colunasRel(r).map((t) => `<span>${ROT[t]} <b>${fmt(tot[t])}</b></span>`).join("")}</div></div></div>`;
  } else h += '<div class="list"><div class="empty">Nenhuma quantidade lançada ainda.</div></div>';
  h += `<div class="callout blue"><p>O WhatsApp não deixa o app escolher o grupo sozinho. Ao tocar em <b>Enviar PDF</b>, o celular abre a lista de apps: escolha o WhatsApp e depois o grupo.</p></div>
    <div class="acoes">
      <button class="btn primary full" id="bShare" type="button" ${r.itens.length ? "" : "disabled"}>📲 Enviar PDF (WhatsApp)</button>
      <button class="btn" id="bPdf" type="button" ${r.itens.length ? "" : "disabled"}>⬇️ Baixar PDF</button>
      <button class="btn" id="bCopy" type="button" ${r.itens.length ? "" : "disabled"}>📋 Copiar texto</button>
      <button class="btn" id="bWpp" type="button" ${r.itens.length ? "" : "disabled"}>💬 Enviar como texto</button>
      <button class="btn full" id="bFim" type="button" ${r.itens.length ? "" : "disabled"}>✅ Concluir e guardar no histórico</button>
    </div>`;
  view.innerHTML = h;
}

/* ================= eventos ================= */
view.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "bq") { bq = t.value; bshow = 60; atualizarBusca(); return; }
  if (t.id === "st") { atual.setor = t.value; salvarAtual(); return; }
  if (t.classList.contains("qi")) {
    const card = t.closest(".pc");
    atual.itens[+card.dataset.i].q[t.dataset.t] = t.value;
    salvarAtual();
    atualizarCartao(card);
  }
});
view.addEventListener("change", (e) => { if (e.target.id === "imp") importar(e.target); });
view.addEventListener("click", async (e) => {
  const t = e.target;
  const chip = t.closest(".chip");
  if (chip) { bmodo = chip.dataset.m; bshow = 60; atualizarBusca(); return; }
  if (t.id === "bmais") { bshow += 100; atualizarBusca(); return; }
  const sel = t.closest(".sel");
  if (sel) { if (alternar(sel.dataset.cod)) atualizarBusca(); return; }
  if (t.id === "nadd") {
    const nome = $("#nn").value.trim().replace(/\s+/g, " ");
    if (!nome) { aviso("Informe o nome do produto."); return; }
    atual.itens.push({ cod: "X" + novoId(), nome, custom: true, codUser: $("#nc").value.trim(), q: qVazio() });
    salvarAtual();
    $("#nn").value = ""; $("#nc").value = "";
    aviso("Produto adicionado à recontagem.");
    bmodo = "marcados";
    atualizarBusca();
    return;
  }
  // botão "+" ao lado de cada campo: acrescenta um sinal de soma para digitar o próximo valor
  const plus = t.closest(".plus");
  if (plus) {
    const inp = plus.closest(".r").querySelector(".qi");
    const v = inp.value.trimEnd();
    if (v && !/[+\-*/x×(]$/.test(v)) {
      inp.value = v + "+";
      inp.dispatchEvent(new Event("input", { bubbles: true }));
    }
    inp.focus();
    inp.setSelectionRange(inp.value.length, inp.value.length);
    return;
  }
  const btn = t.closest("[data-a]");
  if (btn) {
    const a = btn.dataset.a;
    if (a === "toggle") { alternarCartao(btn.closest(".pc"), true); return; }
    if (a === "xitem") {
      const i = +btn.closest(".pc").dataset.i;
      const it = atual.itens[i];
      if (temDigitado(it) && !confirm("Remover " + it.nome + " e as quantidades lançadas?")) return;
      abertos.delete(it.cod); atual.itens.splice(i, 1); salvarAtual(); vContar();
    } else if (a === "nova") {
      atual = { id: novoId(), inicio: new Date().toISOString(), itens: [], setor: "", contador: nomeLogin() };
      salvarAtual(); bq = ""; bmodo = "todos"; ir("/buscar");
    } else if (a === "continuar") ir("/contar");
    else if (a === "descartar") {
      if (confirm("Descartar a recontagem em andamento? As quantidades lançadas serão perdidas.")) {
        atual = null;
        try { localStorage.removeItem(K.atual); } catch (er) {}
        vInicio();
      }
    } else if (a === "hpdf") {
      const c = hist.find((x) => x.id === btn.dataset.h);
      if (c) { btn.disabled = true; const res = await enviarPdf(c, false); btn.disabled = false; if (res === "baixado") aviso("PDF salvo no aparelho."); }
    } else if (a === "hdel") {
      if (confirm("Excluir esta recontagem do histórico?")) { hist = hist.filter((x) => x.id !== btn.dataset.h); gravar(K.hist, hist); vInicio(); }
    } else if (a === "exp") {
      baixar(new Blob([JSON.stringify({ versao: 2, historico: hist }, null, 2)], { type: "application/json" }), "recontagem-backup.json");
    } else if (a === "impBtn") $("#imp").click();
    return;
  }
  if (t.id === "bShare" || t.id === "bPdf") {
    const r = relatorioAtual();
    if (!r.itens.length) return;
    t.disabled = true;
    try {
      const res = await enviarPdf(r, t.id === "bPdf");
      if (res === "baixado") aviso("PDF salvo no aparelho. Anexe no WhatsApp.");
      else if (res === "compartilhado") aviso("Pronto! Se já enviou, toque em Concluir.");
    } catch (er) { aviso("Não consegui gerar o PDF. Tente de novo."); }
    t.disabled = false;
  } else if (t.id === "bCopy") {
    const txt = textoRelatorio(relatorioAtual());
    try { await navigator.clipboard.writeText(txt); aviso("Texto copiado. Cole no WhatsApp."); } catch (er) { aviso("Não consegui copiar."); }
  } else if (t.id === "bWpp") {
    const txt = textoRelatorio(relatorioAtual());
    if (txt.length > 3500) aviso("Texto muito longo; prefira o PDF.");
    window.open("https://wa.me/?text=" + encodeURIComponent(txt), "_blank");
  } else if (t.id === "bFim") {
    const r = relatorioAtual();
    if (!r.itens.length) return;
    if (!confirm("Concluir e guardar no histórico? A recontagem em andamento será encerrada.")) return;
    r.fim = new Date().toISOString();
    hist.unshift(r);
    hist = hist.slice(0, 30);
    gravar(K.hist, hist);
    atual = null;
    try { localStorage.removeItem(K.atual); } catch (er) {}
    aviso("Recontagem concluída e guardada no histórico.");
    ir("/");
  }
});
async function importar(inp) {
  const file = inp.files[0];
  inp.value = "";
  if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (!d || typeof d !== "object") throw 0;
    if (Array.isArray(d.historico)) {
      const ids = new Set(hist.map((h) => h.id));
      d.historico.map(migrarHist).forEach((h) => { if (h && h.id && !ids.has(h.id)) hist.push(h); });
      hist.sort((a, b) => String(b.fim).localeCompare(String(a.fim)));
      hist = hist.slice(0, 30);
      gravar(K.hist, hist);
    }
    aviso("Backup importado.");
    vInicio();
  } catch (e) { aviso("Arquivo inválido. Use um backup exportado por este app."); }
}
// "Enter" no campo só fecha o teclado
view.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || e.target.tagName !== "INPUT") return;
  if (e.target.classList.contains("qi")) {
    const todos = Array.from(e.target.closest(".pc").querySelectorAll(".qi")), k = todos.indexOf(e.target);
    if (k >= 0 && k < todos.length - 1) { e.preventDefault(); todos[k + 1].focus(); return; }
  }
  e.target.blur();
});

render();
</script>
</body>
