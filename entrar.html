<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#37352f">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Entrar</title>
<link rel="stylesheet" href="ocorr.css">
<link rel="stylesheet" href="paginas.css">
<link rel="stylesheet" href="rv.css">
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Início</a>
  <div class="ico">🔐</div>
  <h1>Entrar</h1>
  <p class="sub">Use a sua matrícula e a senha que o administrador te passou.</p>
  <form id="fLogin" class="rvlogin" novalidate>
    <div class="field"><label for="mat">Matrícula</label><input id="mat" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
    <div class="field"><label for="sen">Senha</label><input id="sen" type="password" autocomplete="current-password"></div>
    <div class="callout red hidden" id="erro"><p id="erroTxt"></p></div>
    <div class="row"><button class="btn primary big" id="btnEntrar" type="submit">Entrar</button></div>
    <p class="rvsmall">Esqueceu a senha? Peça uma nova ao administrador.</p>
  </form>
</div>
<script src="rv-config.js"></script>
<script src="rv.js"></script>
<script src="util.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  // só aceita voltar para uma página do próprio app (ex.: contagem.html)
  const volta = (() => { const v = new URLSearchParams(location.search).get("volta") || ""; return /^[a-z0-9-]+\.html$/i.test(v) ? v : "index.html"; })();
  if (RV.logado() && RV.perfilCache()) location.replace(volta);
  $("fLogin").addEventListener("submit", async (e) => {
    e.preventDefault();
    const m = $("mat").value.trim(), s = $("sen").value;
    const erro = (t) => { $("erroTxt").textContent = t; $("erro").classList.remove("hidden"); };
    if (!m || !s) return erro("Preencha a matrícula e a senha.");
    $("btnEntrar").disabled = true; $("btnEntrar").textContent = "Entrando…";
    try {
      await RV.entrar(m, s);
      const p = await RV.meuPerfil();
      if (!p) { await RV.sair(); throw new Error("Este login não tem acesso. Fale com o administrador."); }
      location.replace(volta);
    } catch (err) { erro(err.message); $("btnEntrar").disabled = false; $("btnEntrar").textContent = "Entrar"; $("sen").value = ""; }
  });
</script>
</body>
</html>
