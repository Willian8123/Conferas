<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070d24">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Farol de fim de turno</title>
<link rel="stylesheet" href="ocorr.css">
<script src="rv-config.js"></script><script src="rv.js"></script><script src="acesso.js" data-exigir="conferente"></script>
<style>
  .seg{display:flex;gap:8px}
  .seg button{flex:1;padding:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:8px;font:inherit;font-weight:600;cursor:pointer;font-size:16px}
  .seg button.on{border-color:var(--accent);background:var(--callout)}
  .tg{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;margin-top:10px}
  .tg>b{flex:1;font-size:15px}
  .tg .seg{flex:0 0 150px}
  .g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .g .field.full{grid-column:1/-1}
  .prev{white-space:pre-wrap;font-size:14px;line-height:1.45;border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--bg);word-break:break-word}
  .hint{font-size:12px;color:var(--muted)}
  .totbar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border);padding:10px 0;margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
  .totbar .btn{flex:1;min-width:130px}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="conferente.html">← Conferente</a>
  <div class="ico">🚦</div>
  <h1>Farol de fim de turno</h1>
  <p class="sub">Já abre com o último farol enviado. Mude só o que mudou e mande no grupo.</p>
  <div class="callout blue" id="ultimo"><p>Carregando o último farol…</p></div>

  <div class="sec">Turno</div>
  <div class="g" style="margin-top:0">
    <div class="field"><label for="turno">Turno</label>
      <select id="turno"><option>Turno A</option><option>Turno B</option><option>Turno C</option></select></div>
    <div class="field"><label for="fech">Fechamento</label><input id="fech" type="text" autocomplete="off" placeholder="Ex.: 21:50"></div>
  </div>

  <div class="sec">Carros</div>
  <div class="g" style="margin-top:0">
    <div class="field"><label for="rota">Carros em rota</label><input id="rota" type="text" autocomplete="off"></div>
    <div class="field"><label for="desc">Carros para descarregar</label><input id="desc" type="text" autocomplete="off"></div>
    <div class="field full"><label for="nota1">Observação dos carros</label><input id="nota1" type="text" autocomplete="off" placeholder="Ex.: Equipe só irá bater na segunda feira."></div>
    <div class="field"><label for="conf">Para conferir</label><input id="conf" type="text" autocomplete="off"></div>
    <div class="field"><label for="rec">Carretas recebidas</label><input id="rec" type="text" autocomplete="off" placeholder="Ex.: 1 + DROP"></div>
    <div class="field"><label for="ident">Identificar</label><input id="ident" type="text" autocomplete="off"></div>
    <div class="field"><label for="pal">Pallets para armazenar</label><input id="pal" type="text" autocomplete="off" placeholder="Ex.: +/- 56 Pallets"></div>
  </div>

  <div class="sec">Situação</div>
  <div class="tg"><b>📦 Maria mole</b><div class="seg" data-k="mm"></div></div>
  <div class="field" style="margin-top:8px"><input id="nota2" type="text" autocomplete="off" placeholder="Observação da Maria mole (Ex.: 1 pra bater)"></div>
  <div class="tg"><b>↩️ Devolução</b><div class="seg" data-k="dev"></div></div>
  <div class="tg"><b>🍷 Marketplace</b><div class="seg" data-k="mk"></div></div>
  <div class="tg"><b>🚚 Drop</b><div class="seg" data-k="drop"></div></div>
  <div class="tg"><b>🫧 5s retorno</b><div class="seg" data-k="s5r"></div></div>
  <div class="tg"><b>🫧 5s Maria mole</b><div class="seg" data-k="s5m"></div></div>

  <div class="sec">Outros</div>
  <div class="g" style="margin-top:0">
    <div class="field full"><label for="retr">🔀 Retrabalho</label><input id="retr" type="text" autocomplete="off" placeholder="Ex.: 1 desde sábado"></div>
    <div class="field full"><label for="chopp">🛢️ Chopp (linha livre)</label><input id="chopp" type="text" autocomplete="off" placeholder="Ex.: Chopp para guardar."></div>
    <div class="field full"><label for="obs">OBS</label><input id="obs" type="text" autocomplete="off" placeholder="Ex.: ABS de OP conferente"></div>
  </div>

  <div class="sec">Mensagem</div>
  <div class="prev" id="prev"></div>
  <div class="callout green hidden" id="ok"><p id="okTxt"></p></div>
  <div class="callout yellow hidden" id="av"><p id="avTxt"></p></div>

  <div class="totbar">
    <button class="btn primary" type="button" id="zap">📲 Enviar no WhatsApp</button>
    <button class="btn" type="button" id="copiar">📋 Copiar texto</button>
    <button class="btn" type="button" id="zerar">Começar do zero</button>
  </div>
</div>

<script src="ocorr.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const TXT = ["fech", "rota", "desc", "nota1", "conf", "rec", "ident", "pal", "nota2", "retr", "chopp", "obs"];
  const TOG = ["mm", "dev", "mk", "drop", "s5r", "s5m"];
  const LS = "farol_ultimo_v1";
  const p2 = (n) => String(n).padStart(2, "0");
  let tg = { mm: false, dev: false, mk: false, drop: false, s5r: false, s5m: false };

  function turnoAgora() { // o farol final sai perto do fim do turno: conta como o turno que está acabando
    const h = new Date(Date.now() - 60 * 60 * 1000).getHours();
    return h >= 6 && h < 14 ? "Turno A" : h >= 14 && h < 22 ? "Turno B" : "Turno C";
  }
  const hhmm = () => { const d = new Date(); return p2(d.getHours()) + ":" + p2(d.getMinutes()); };

  // os botões ✅ / ❌
  document.querySelectorAll(".seg[data-k]").forEach((s) => {
    s.innerHTML = '<button type="button" data-v="1">✅</button><button type="button" data-v="0">❌</button>';
    s.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; tg[s.dataset.k] = b.dataset.v === "1"; pintar(); montar(); });
  });
  function pintar() { document.querySelectorAll(".seg[data-k]").forEach((s) => { [...s.children].forEach((b) => b.classList.toggle("on", (b.dataset.v === "1") === tg[s.dataset.k])); }); }

  function dados() {
    const d = {}; TXT.forEach((k) => { d[k] = $(k).value.trim(); }); TOG.forEach((k) => { d[k] = tg[k]; }); return d;
  }
  function preencher(d) {
    TXT.forEach((k) => { $(k).value = d && d[k] != null ? d[k] : ""; });
    TOG.forEach((k) => { tg[k] = !!(d && d[k]); });
    pintar();
  }

  const sim = (v) => (v ? "✅" : "❌");
  function texto(d, turno) {
    const L = [];
    L.push("🚦 FAROL FINAL • " + turno.toUpperCase());
    L.push("⏰ Fechamento: " + d.fech);
    L.push("");
    L.push("🚗 carros em rota: " + d.rota);
    L.push("🚗 carros para descarregar: " + d.desc);
    if (d.nota1) L.push(d.nota1);
    L.push("");
    L.push("🚗 para conferir: " + d.conf);
    L.push("");
    L.push("🚛 Carretas recebidas: " + d.rec);
    L.push("📝 identificar: " + d.ident);
    L.push("📦 Pallets para armazenar: " + d.pal);
    L.push("");
    L.push("📦 Maria mole: " + sim(d.mm));
    if (d.nota2) L.push(d.nota2);
    L.push("");
    L.push("↩️ Devolução: " + sim(d.dev));
    L.push("");
    L.push("🍷Marketplace" + sim(d.mk));
    L.push("");
    L.push("🚚 Drop: " + sim(d.drop));
    L.push("");
    L.push("🫧 5s retorno " + sim(d.s5r));
    L.push("🫧5s Maria mole " + sim(d.s5m));
    L.push("🔀 Retrabalho: " + d.retr);
    if (d.chopp) { L.push(""); L.push("🛢️" + d.chopp); }
    if (d.obs) { L.push(""); L.push("OBS: " + d.obs); }
    return L.join("\n");
  }
  function montar() { $("prev").textContent = texto(dados(), $("turno").value); }
  TXT.concat(["turno"]).forEach((k) => $(k).addEventListener("input", montar));

  function aviso(t, tipo) { const ok = tipo === "ok"; $("okTxt").textContent = ok ? t : ""; $("ok").classList.toggle("hidden", !ok); $("avTxt").textContent = ok ? "" : t; $("av").classList.toggle("hidden", ok); }

  async function guardar() {
    const d = dados(), t = $("turno").value, tx = texto(d, t);
    try { localStorage.setItem(LS, JSON.stringify({ d, t })); } catch (e) {}
    try { await RV.rpc("farol_salvar", { p_turno: t, p_dados: d, p_texto: tx }); return true; } catch (e) { return false; }
  }

  $("copiar").addEventListener("click", async () => {
    const tx = texto(dados(), $("turno").value);
    let ok = false;
    try { await navigator.clipboard.writeText(tx); ok = true; } catch (e) {
      const ta = document.createElement("textarea"); ta.value = tx; document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand("copy"); } catch (er) {} ta.remove();
    }
    const salvo = await guardar();
    aviso(ok ? "Texto copiado. Cole no grupo." + (salvo ? "" : " (Não consegui salvar no servidor agora.)") : "Não consegui copiar. Selecione o texto da mensagem e copie.", ok ? "ok" : "av");
  });

  $("zap").addEventListener("click", async () => {
    const tx = texto(dados(), $("turno").value);
    const salvo = await guardar();
    if (navigator.share) {
      try { await navigator.share({ text: tx }); aviso("Pronto." + (salvo ? "" : " (Não consegui salvar no servidor agora.)"), "ok"); return; } catch (e) { if (e && e.name === "AbortError") return; }
    }
    window.open("https://wa.me/?text=" + encodeURIComponent(tx), "_blank", "noopener");
  });

  $("zerar").addEventListener("click", () => {
    if (!confirm("Limpar todos os campos?")) return;
    preencher({}); $("fech").value = hhmm(); montar();
  });

  async function iniciar() {
    $("turno").value = turnoAgora();
    let ult = null;
    try { ult = await RV.rpc("farol_ultimo"); } catch (e) {}
    if (ult && ult.dados) {
      preencher(ult.dados);
      const d = new Date(ult.criado_em);
      $("ultimo").innerHTML = "<p>Último farol: <b>" + Ocorr.esc(ult.turno || "") + "</b> · " + p2(d.getDate()) + "/" + p2(d.getMonth() + 1) + " " + p2(d.getHours()) + ":" + p2(d.getMinutes()) + (ult.por ? " · " + Ocorr.esc(ult.por) : "") + ". Os campos vieram dele.</p>";
    } else {
      let loc = null; try { loc = JSON.parse(localStorage.getItem(LS)); } catch (e) {}
      if (loc && loc.d) { preencher(loc.d); $("ultimo").innerHTML = "<p>Sem conexão com o servidor: usei o último farol deste aparelho.</p>"; }
      else { preencher({}); $("ultimo").innerHTML = "<p>Ainda não há farol salvo. Preencha o primeiro; os próximos já abrem com ele.</p>"; }
    }
    $("fech").value = hhmm(); // horário do fechamento: agora (dá para mudar)
    montar();
  }
  pintar(); iniciar();
})();
</script>
</body>
</html>
