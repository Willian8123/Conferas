<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a3fa8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Feed</title>
<link rel="stylesheet" href="ocorr.css">
<link rel="stylesheet" href="paginas.css">
<link rel="stylesheet" href="rv.css">
<link rel="stylesheet" href="feed.css">
<script src="rv-config.js"></script><script src="rv.js"></script><script src="foto.js"></script><script src="acesso.js" data-exigir=""></script>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Início</a>
  <header class="fhead">
    <img src="lobinho.png" alt="" onerror="this.style.display='none'">
    <div><h1>Feed</h1><p>Avisos, enquetes e novidades do CDD Embu</p></div>
  </header>
  <div class="fmsg2 hidden" id="erro"></div>
  <div class="ftools">
    <button class="btn lb hidden" id="bNovo" type="button">＋ Novo post</button>
    <button class="btn" id="bAtualizar" type="button">↻ Atualizar</button>
  </div>

  <form class="fnovo hidden" id="fNovo" novalidate>
    <h2>Novo post</h2>
    <textarea id="nTxt" maxlength="1500" placeholder="Escreva o aviso ou a pergunta…"></textarea>
    <div class="cont"><span id="nCont">0</span>/1500</div>
    <div class="prev hidden" id="nPrev"><img id="nImg" alt="Pré-visualização"><button class="btn mini" id="nImgX" type="button">Remover</button></div>
    <label class="btn full" id="nPick">🖼️ Adicionar imagem<input type="file" accept="image/*" id="nArq" hidden></label>
    <label class="chk"><input type="checkbox" id="nEnq"> Criar enquete (cada pessoa escolhe 1 opção)</label>
    <div class="ops hidden" id="nOps"></div>
    <button class="btn mini hidden" id="nMais" type="button">＋ Mais uma opção</button>
    <p class="dica">O post fica no ar por 10 dias e depois é apagado sozinho, junto com comentários e curtidas.</p>
    <div class="fmsg2 hidden" id="nErro"></div>
    <div class="row"><button class="btn lb" id="nPub" type="submit">Publicar</button><button class="btn" id="nCancel" type="button">Cancelar</button></div>
  </form>

  <div id="lista"><p class="rvsmall" style="text-align:center;margin:30px 0">Carregando…</p></div>
</div>
<script src="util.js"></script>
<script src="feed.js"></script>
</body>
</html>
