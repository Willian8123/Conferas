<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070d24">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Alerta Fábrica</title>
<link rel="stylesheet" href="ocorr.css">
<script src="rv-config.js"></script><script src="rv.js"></script><script src="acesso.js" data-exigir="ocorrencias"></script>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Início</a>
  <div class="ico">📨</div>
  <h1>Alerta Fábrica</h1>
  <p class="sub">Avise a fábrica por e-mail sobre problemas na carga, com descrição e fotos.</p>

  <div class="menu">
    <a class="item" href="chamado.html">
      <span class="e">🚨</span>
      <div><b>Novo alerta</b><span>Registrar e abrir o e-mail pronto para enviar</span></div>
      <span class="go">›</span>
    </a>
    <a class="item" href="fabricas.html">
      <span class="e">🏭</span>
      <div><b>Cadastro de fábricas</b><span id="cnt">Nome e e-mail de cada fábrica</span></div>
      <span class="go">›</span>
    </a>
  </div>
</div>
<script src="ocorr.js"></script>
<script>
  const el = document.getElementById("cnt");
  function mostra(n) { el.textContent = n === 0 ? "Nenhuma fábrica cadastrada ainda" : n + (n === 1 ? " fábrica cadastrada" : " fábricas cadastradas"); }
  mostra(Ocorr.lerCache().length);
  Ocorr.fabricas().then((r) => mostra(r.lista.length)).catch(() => {});
</script>
</body>
</html>
