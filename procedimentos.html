<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070d24">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Passo a passo</title>
<link rel="stylesheet" href="ocorr.css">
<link rel="stylesheet" href="paginas.css">
<script src="rv-config.js"></script><script src="rv.js"></script><script src="acesso.js" data-exigir="conferente"></script>
</head>
<body>
<div class="wrap">
  <a class="back" href="conferente.html">← Menu</a>
  <div class="ico">📝</div>
  <h1>Passo a passo</h1>
  <p class="sub">Procedimentos do dia a dia. Toque no título para abrir.</p>

  <div class="topbar"><input id="pq2" class="search" type="search" autocomplete="off" placeholder="🔎 Filtrar procedimentos (ex.: placa, NF, WMS, SAP)"></div>
  <div id="vazio" class="empty hidden">Nenhum procedimento encontrado.</div>


  <div id="conteudo"><div class="empty">Carregando…</div></div>
</div>
<script src="util.js"></script>
<script src="conteudo.js"></script>
<script>
const q2=document.getElementById("pq2");
const norm=t=>t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function filtra(){
  const q=norm(q2.value.trim());let n=0;
  document.querySelectorAll("details[data-s]").forEach(d=>{
    const ok=!q||norm(d.dataset.s+" "+d.textContent).includes(q);
    d.classList.toggle("hidden",!ok);if(ok)n++;
    if(q&&ok)d.open=true;
  });
  document.getElementById("vazio").classList.toggle("hidden",n>0);
}
q2.addEventListener("input",filtra);
function abreHash(){
  const id=location.hash.slice(1);if(!id)return;
  const d=document.getElementById(id);
  if(d&&d.tagName==="DETAILS"){d.open=true;setTimeout(()=>d.scrollIntoView({block:"start"}),50)}
}
window.addEventListener("hashchange",abreHash);
Conteudo.montar("procedimentos", document.getElementById("conteudo"), function(){ if(q2.value.trim())filtra(); abreHash(); });
</script>
</body>
</html>
