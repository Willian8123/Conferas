<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#37352f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Produtos</title>
<link rel="stylesheet" href="ocorr.css">
<link rel="stylesheet" href="paginas.css">
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Menu</a>
  <div class="ico">🔎</div>
  <h1>Produtos</h1>
  <p class="sub">Digite o <b>código</b> para ver o nome, ou o <b>nome</b> para achar o código. Toque na linha para copiar o código.</p>

  <div class="pbox"><input id="pq" class="search" type="search" inputmode="search" autocomplete="off" placeholder="Ex.: 2538  ·  pilsen 600  ·  guarana 2l" style="width:100%"></div>
  <div class="pmeta" id="pmeta"></div>
  <div id="plist"></div>
  <button class="btn pmore hidden" id="pmore">Mostrar mais</button>
</div>
<script src="util.js"></script>
<script src="produtos-dados.js"></script>
<script>
const P=window.PRODUTOS;
const norm=t=>t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const PN=P.map(p=>norm(p[1]));
const esc=t=>t.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const pq=document.getElementById("pq"),plist=document.getElementById("plist"),pmeta=document.getElementById("pmeta"),pmore=document.getElementById("pmore");
let pres=[],pshow=60,ptoks=[];
function hl(name){
  let h=esc(name);
  ptoks.filter(t=>t.length>1&&!/^\d+$/.test(t)||/^\d+$/.test(t)&&t.length>2).forEach(t=>{
    const re=new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
    h=h.replace(re,"<mark>$1</mark>");
  });
  return h;
}
function prender(){
  const part=pres.slice(0,pshow);
  plist.innerHTML=part.map(i=>`<div class="prod" data-c="${P[i][0]}"><span class="code">${P[i][0]}</span><span class="nm">${hl(P[i][1])}</span></div>`).join("");
  pmore.classList.toggle("hidden",pres.length<=pshow);
  pmore.textContent="Mostrar mais ("+(pres.length-pshow)+" restantes)";
  pmeta.textContent=pres.length?(pres.length+" de "+P.length+" produtos"):"Nenhum produto encontrado. Tente menos palavras.";
}
function pbuscar(){
  const q=norm(pq.value.trim());
  ptoks=q.split(/\s+/).filter(Boolean);
  pshow=60;
  if(!ptoks.length){pres=[];plist.innerHTML="";pmore.classList.add("hidden");pmeta.textContent=P.length+" produtos cadastrados. Digite para buscar.";return}
  pres=[];
  P.forEach((p,i)=>{
    const ok=ptoks.every(t=>PN[i].includes(t)||p[0].startsWith(t)||(/^\d{3,}$/.test(t)&&p[0].includes(t)));
    if(ok)pres.push(i);
  });
  // código exato primeiro, depois código que começa com o termo
  const t0=ptoks[0];
  pres.sort((a,b)=>{
    const sa=P[a][0]===t0?0:P[a][0].startsWith(t0)?1:2, sb=P[b][0]===t0?0:P[b][0].startsWith(t0)?1:2;
    return sa-sb||a-b;
  });
  prender();
}
pq.addEventListener("input",pbuscar);
pmore.addEventListener("click",()=>{pshow+=100;prender()});
plist.addEventListener("click",e=>{
  const r=e.target.closest(".prod");if(!r)return;
  const t=r.dataset.c;
  const done=()=>{r.classList.add("ok");setTimeout(()=>r.classList.remove("ok"),900)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,done)}else done();
});
pbuscar();
document.getElementById("pq").focus();
</script>
</body>
</html>
