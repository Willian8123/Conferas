<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#37352f">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Lobinho</title>
<link rel="stylesheet" href="ocorr.css">
<link rel="stylesheet" href="paginas.css">
<link rel="stylesheet" href="rv.css">
<script src="rv-config.js"></script><script src="rv.js"></script><script src="foto.js"></script><script src="acesso.js" data-exigir="lobinho"></script>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← Início</a>

  <div class="lobo"><span class="lobo-i" id="loboIco"><img src="lobinho.png" alt="Lobinho" class="rvlogo" onerror="this.parentNode.textContent='🐺'"></span></div>
  <h1 id="ola">Lobinho</h1>
  <p class="sub" id="quem">Minha RV</p>
  <p style="margin:-6px 0 8px"><button class="fotolink" id="bFotoLink" type="button">📷 Colocar minha foto</button></p>
  <div id="painel"></div>

  <div class="sec">Conta</div>
  <div class="row">
    <button class="btn" id="btnSenha" type="button">🔑 Trocar senha</button>
    <button class="btn" id="btnSair" type="button">Sair</button>
    <a class="btn hidden" id="lnkAdmin" href="rv-admin.html">🛠️ Administrador</a>
  </div>
  <form id="fSenha" class="hidden" novalidate>
    <div class="field" style="margin-top:8px"><label for="ns">Nova senha (mínimo 8 caracteres)</label><input id="ns" type="password" autocomplete="new-password"></div>
    <div class="field" style="margin-top:8px"><label for="ns2">Repita a nova senha</label><input id="ns2" type="password" autocomplete="new-password"></div>
    <div class="callout hidden" id="msgSenha"><p id="msgSenhaTxt"></p></div>
    <div class="row"><button class="btn primary" type="submit">Salvar nova senha</button></div>
  </form>
</div>
<script src="util.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const aviso = (box, txt, cor) => { $(box).className = "callout " + (cor || "red"); $(box + "Txt").textContent = txt; };

  // a foto da pessoa ocupa o lugar do lobo; sem foto, o lobo continua
  function pintarFoto(perfil) {
    const img = Foto.minha(), lobo = document.querySelector(".lobo");
    if (!lobo) return;
    if (img) {
      lobo.innerHTML = '<button class="avbtn" id="bFotoRv" type="button" aria-label="Trocar minha foto">' + Foto.avatar(perfil.nome, img, "rvfoto") + '</button>';
      $("bFotoRv").onclick = () => Foto.abrir(() => pintarFoto(perfil));
    } else if (!lobo.querySelector(".rvlogo")) {
      lobo.innerHTML = '<span class="lobo-i" id="loboIco"><img src="lobinho.png" alt="Lobinho" class="rvlogo" onerror="this.parentNode.textContent=\'🐺\'"></span>';
    }
    $("bFotoLink").style.display = img ? "none" : "";
    $("bFotoLink").onclick = () => Foto.abrir(() => pintarFoto(perfil));
  }

  async function abrir() {
    if (!$("painel")) return;
    $("painel").innerHTML = '<p class="rvsmall" style="text-align:center;margin:30px 0">Carregando…</p>';
    try {
      const perfil = await RV.meuPerfil();
      if (!perfil) { await RV.sair(); return location.replace("entrar.html?volta=rv.html"); }
      if (!$("painel")) return; // a guarda de acesso trocou a tela por "Sem acesso"
      const [cfg, linhas] = await Promise.all([RV.config(), RV.dadosDe(perfil.matricula)]);
      if (!$("painel")) return;
      $("ola").textContent = "Olá, " + (perfil.nome || "").trim().split(/\s+/)[0] + " 👋";
      $("quem").textContent = ["Lobinho · Minha RV", perfil.cargo, "Matrícula " + perfil.matricula].filter(Boolean).join(" · ");
      $("lnkAdmin").classList.toggle("hidden", !perfil.admin);
      pintarFoto(perfil);
      Foto.sincronizar().then(() => pintarFoto(perfil)).catch(() => {});
      if (!cfg) $("painel").innerHTML = '<div class="callout yellow"><p>O painel ainda não foi configurado pelo administrador.</p></div>';
      else RV.painel($("painel"), perfil, linhas, cfg, {});
    } catch (e) {
      if (e.status === 400 || e.status === 401 || e.status === 403) { await RV.sair(); return location.replace("entrar.html?volta=rv.html"); }
      if (!$("painel")) return;
      $("painel").innerHTML = '<div class="callout red"><p>' + RV.esc(e.message) + '</p></div><div class="row"><button class="btn" id="btnDeNovo">Tentar de novo</button></div>';
      $("btnDeNovo").addEventListener("click", abrir);
    }
  }
  $("btnSair").addEventListener("click", async () => { await RV.sair(); location.href = "index.html"; });
  $("btnSenha").addEventListener("click", () => $("fSenha").classList.toggle("hidden"));
  $("fSenha").addEventListener("submit", async (e) => {
    e.preventDefault();
    const a = $("ns").value, b = $("ns2").value;
    $("msgSenha").className = "callout hidden";
    if (a.length < 8) return aviso("msgSenha", "A senha precisa ter pelo menos 8 caracteres.");
    if (a !== b) return aviso("msgSenha", "As duas senhas não são iguais.");
    try { await RV.trocarSenha(a); $("ns").value = $("ns2").value = ""; aviso("msgSenha", "Senha alterada com sucesso.", "green"); }
    catch (err) { aviso("msgSenha", err.message); }
  });
  if (RV.logado()) abrir();
</script>
</body>
</html>
